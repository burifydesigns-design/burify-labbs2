<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad_traffic-no-customers.svg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060f"/>
      <stop offset="50%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#06060f"/>
    </linearGradient>
    <filter id="glow_traffic-no-customers.svg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid_traffic-no-customers.svg" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(107,95,169,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="dots_traffic-no-customers.svg" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="rgba(107,95,169,0.15)"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad_traffic-no-customers.svg)"/>
  <rect width="1080" height="1350" fill="url(#grid_traffic-no-customers.svg)"/>
  <rect width="1080" height="1350" fill="url(#dots_traffic-no-customers.svg)"/>

  
  <circle cx="540" cy="520" r="180" fill="#e8453a" opacity="0.04" filter="url(#glow_traffic-no-customers)"/>
  <rect x="200" y="340" width="280" height="360" rx="16" fill="#0d0d1f" stroke="rgba(77,217,217,0.25)" stroke-width="1"/>
  <text x="340" y="400" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">TRAFFIC</text>
  <text x="340" y="460" text-anchor="middle" font-family="ui-monospace, monospace" font-size="32" font-weight="700" fill="#4dd9d9">24,891</text>
  <text x="340" y="500" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)">visitors this month</text>
  <rect x="240" y="540" width="200" height="8" rx="4" fill="rgba(77,217,217,0.3)"/>
  <rect x="240" y="560" width="160" height="8" rx="4" fill="rgba(77,217,217,0.2)"/>
  <rect x="240" y="580" width="120" height="8" rx="4" fill="rgba(77,217,217,0.15)"/>

  <text x="540" y="490" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="rgba(255,255,255,0.6)" opacity="0.5">≠</text>

  <rect x="600" y="340" width="280" height="360" rx="16" fill="#0d0d1f" stroke="rgba(232,69,58,0.25)" stroke-width="1"/>
  <text x="740" y="400" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">CONVERSIONS</text>
  <text x="740" y="460" text-anchor="middle" font-family="ui-monospace, monospace" font-size="32" font-weight="700" fill="#e8453a">23</text>
  <text x="740" y="500" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)"> enquiries only</text>
  <rect x="680" y="540" width="120" height="8" rx="4" fill="rgba(232,69,58,0.3)"/>
  <rect x="680" y="560" width="80" height="8" rx="4" fill="rgba(232,69,58,0.2)"/>
  <rect x="680" y="580" width="40" height="8" rx="4" fill="rgba(232,69,58,0.15)"/>

  <!-- Title -->
  <rect x="60" y="1080" width="960" height="180" rx="20" fill="#0d0d1f" stroke="rgba(107,95,169,0.25)" stroke-width="1"/>
  <text x="540" y="1160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="3">BURIFY</text>
  <text x="540" y="1215" text-anchor="middle" font-family="ui-monospace, monospace" font-size="28" font-weight="700" fill="#ffffff">Traffic Is Not the Same as Customers</text>
  <line x1="120" y1="1250" x2="960" y2="1250" stroke="rgba(107,95,169,0.25)" stroke-width="1"/>
  <text x="540" y="1285" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="2">WEB DESIGN · AI AUTOMATION</text>

  <!-- Accent corner -->
  <rect x="0" y="0" width="8" height="1350" fill="#e8453a" opacity="0.6"/>
</svg>