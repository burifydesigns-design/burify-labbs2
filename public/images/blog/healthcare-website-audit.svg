  <rect x="180" y="590" width="720" height="52" rx="10" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <rect x="196" y="604" width="24" height="24" rx="6" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M 202 616 l 5 5 l 10 -10" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
