  <rect x="196" y="540" width="24" height="24" rx="6" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M 202 552 l 5 5 l 10 -10" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
