<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad_ai-search-ready.svg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060f"/>
      <stop offset="50%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#06060f"/>
    </linearGradient>
    <filter id="glow_ai-search-ready.svg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid_ai-search-ready.svg" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(107,95,169,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="dots_ai-search-ready.svg" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="rgba(107,95,169,0.15)"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad_ai-search-ready.svg)"/>
  <rect width="1080" height="1350" fill="url(#grid_ai-search-ready.svg)"/>
  <rect width="1080" height="1350" fill="url(#dots_ai-search-ready.svg)"/>

  
  <circle cx="540" cy="520" r="180" fill="#6b5fa9" opacity="0.04" filter="url(#glow_ai-search-ready)"/>
  <rect x="200" y="340" width="680" height="50" rx="12" fill="#0d0d1f" stroke="rgba(107,95,169,0.25)" stroke-width="1"/>
