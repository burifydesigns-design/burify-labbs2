<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad_cheap-vs-affordable.svg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060f"/>
      <stop offset="50%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#06060f"/>
    </linearGradient>
    <filter id="glow_cheap-vs-affordable.svg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid_cheap-vs-affordable.svg" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(107,95,169,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="dots_cheap-vs-affordable.svg" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="rgba(107,95,169,0.15)"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bgGrad_cheap-vs-affordable.svg)"/>
  <rect width="1080" height="1350" fill="url(#grid_cheap-vs-affordable.svg)"/>
  <rect width="1080" height="1350" fill="url(#dots_cheap-vs-affordable.svg)"/>

  
  <circle cx="540" cy="520" r="180" fill="#e8915a" opacity="0.04" filter="url(#glow_cheap-vs-affordable)"/>
  <rect x="220" y="340" width="280" height="360" rx="20" fill="#0d0d1f" stroke="rgba(232,69,58,0.3)" stroke-width="1"/>
  <text x="360" y="400" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">CHEAP</text>
  <text x="360" y="460" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#e8453a">$500</text>
  <line x1="260" y1="500" x2="460" y2="500" stroke="rgba(232,69,58,0.2)" stroke-width="1"/>
  <text x="360" y="530" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)">Rebuilds</text>
  <text x="360" y="555" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)">Poor UX</text>
  <text x="360" y="580" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)">Weak conversion</text>
  <text x="360" y="605" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)">Difficult maintenance</text>
  <text x="360" y="650" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#e8453a">Hidden costs</text>

  <rect x="580" y="340" width="280" height="360" rx="20" fill="#0d0d1f" stroke="rgba(74,222,128,0.3)" stroke-width="1"/>
  <text x="720" y="400" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">SMARTER VALUE</text>
  <text x="720" y="460" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#4ade80">$3,000</text>
  <line x1="620" y1="500" x2="820" y2="500" stroke="rgba(74,222,128,0.2)" stroke-width="1"/>
  <text x="720" y="530" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.6)">Built to last</text>
  <text x="720" y="555" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.6)">Strong UX</text>
  <text x="720" y="580" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.6)">Clear conversion</text>
  <text x="720" y="605" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.6)">Easy to maintain</text>
  <text x="720" y="650" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#4ade80">Long-term value</text>

  <!-- Title -->
  <rect x="60" y="1080" width="960" height="180" rx="20" fill="#0d0d1f" stroke="rgba(107,95,169,0.25)" stroke-width="1"/>
  <text x="540" y="1160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="3">BURIFY</text>
  <text x="540" y="1215" text-anchor="middle" font-family="ui-monospace, monospace" font-size="28" font-weight="700" fill="#ffffff">Cheap Website ≠ Affordable Website</text>
  <line x1="120" y1="1250" x2="960" y2="1250" stroke="rgba(107,95,169,0.25)" stroke-width="1"/>
  <text x="540" y="1285" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="2">WEB DESIGN · AI AUTOMATION</text>

  <!-- Accent corner -->
  <rect x="0" y="0" width="8" height="1350" fill="#e8915a" opacity="0.6"/>
</svg>