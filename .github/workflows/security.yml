name: Security and quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Verify installed Gitleaks
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $gitleaks = Get-Command gitleaks -ErrorAction Stop
          Write-Host "Using Gitleaks at $($gitleaks.Source)"
          gitleaks version
      - name: Scan repository history for secrets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          gitleaks detect --source . --redact --verbose

  app-checks:
    name: Dependency, lint, type and build checks
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm ci
      - name: Audit production dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run lint
      - name: Type check
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run typecheck
      - name: Production build
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: ci-placeholder-server-secret
          PAYMENTS_ENABLED: "false"
          NEXT_PUBLIC_SITE_URL: https://burifylabs.com
