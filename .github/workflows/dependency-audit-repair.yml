name: Safe dependency audit repair
on:
  push:
    branches:
      - fix/growth-platform-hardening
    paths:
      - scripts/dependency-audit-trigger.txt
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger safe dependency audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking dependency security updates
        run: npm audit fix --ignore-scripts || true
      - name: Report remaining advisories
        run: |
          npm audit --json > /tmp/burify-audit.json || true
          node -e "const a=require('/tmp/burify-audit.json'); const m=a.metadata?.vulnerabilities||{}; console.log(JSON.stringify({total:m.total||0,low:m.low||0,moderate:m.moderate||0,high:m.high||0,critical:m.critical||0},null,2))"
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: apply non-breaking npm audit fixes"
            git push
          else
            echo "No compatible dependency updates were available."
          fi
